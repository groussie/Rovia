Sc_Receptions As screen:
    ContentLanguage: =""
    Fill: =gblTheme.Colors.Background
    Height: =App.Height
    LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    OnVisible: |-
        =ClearCollect(
            colReception,
            AddColumns(
                Reception,
                ClientName,
                Client.Value
            )
        )
    Width: =App.Width

    RectQuickActionBar1_1 As rectangle:
        Fill: =gblTheme.Colors.Primary
        Height: =88
        Width: =Parent.Width
        ZIndex: =1

    "gal_Receptions As gallery.'BrowseLayout_Vertical_TwoTextVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        BorderColor: =gblTheme.Colors.Border
        DelayItemLoading: =true
        Fill: =gblTheme.Colors.Surface
        Height: =Parent.Height - Self.Y
        Items: |-
            =//colReception
            SortByColumns(Search(colReception, TextSearchBox1_1.Text, ClientName), "DateReception", If(SortDescending1, SortOrder.Descending, SortOrder.Ascending))
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: =Navigate(Sc_Items_Reception, ScreenTransition.Cover)
        TemplatePadding: =0
        TemplateSize: =122
        Width: =Parent.Width
        Y: =TextSearchBox1_1.Y + TextSearchBox1_1.Height
        ZIndex: =2

        Title2_1 As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =gblTheme.Colors.TextMain
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =gblTheme.Fonts.Normal
            Text: =ThisItem.Client.Value
            VerticalAlign: =VerticalAlign.Top
            Width: =Parent.TemplateWidth - 86
            X: =16
            Y: =(Parent.TemplateHeight - (Self.Size * 1.8 + Subtitle2_1.Size * 1.8)) / 2
            ZIndex: =1

        Subtitle2_1 As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =gblTheme.Colors.TextSub
            FontWeight: =If(ThisItem.IsSelected, FontWeight.Semibold, FontWeight.Normal)
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =gblTheme.Fonts.Small
            Text: =ThisItem.DateReception
            VerticalAlign: =VerticalAlign.Top
            Width: =Title2_1.Width
            X: =Title2_1.X
            Y: =Title2_1.Y + Title2_1.Height
            ZIndex: =2

        NextArrow2_1 As icon:
            AccessibleLabel: =Self.Tooltip
            Color: =RGBA(166, 166, 166, 1)
            Height: =50
            Icon: =Icon.ChevronRight
            OnSelect: =Select(Parent)
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Tooltip: ="View item details"
            Width: =50
            X: =Parent.TemplateWidth - Self.Width - 12
            Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            ZIndex: =3

        Separator2_1 As rectangle:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =8
            OnSelect: =Select(Parent)
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - Self.Height
            ZIndex: =4

        Rectangle2_1 As rectangle:
            Fill: =gblTheme.Colors.Accent
            Height: =Parent.TemplateHeight - Separator2_1.Height
            OnSelect: =Select(Parent)
            Visible: =ThisItem.IsSelected
            Width: =4
            ZIndex: =5

