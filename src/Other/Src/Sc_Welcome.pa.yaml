Screens:
  Sc_Welcome:
    Properties:
      Fill: =gblColorBackground
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      Width: =App.Width
    Children:
      - Container1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - Text1:
                Control: ModernText@1.0.0
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  Color: =gblColorTextMain
                  Font: =Font.'Segoe UI'
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  Size: =48
                  Text: ="Prototype d'application pour la saisie des arrivees de Rouleaux"
                  Width: =500
            - Liste des clients:
                Control: ModernButton@1.0.0
                Properties:
                  Appearance: =ButtonAppearance.Transparent
                  BasePaletteColor: =gblColorAccent
                  BorderColor: =gblColorBorder
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Navigate(Sc_Customers, ScreenTransition.Cover)
                  Text: ="Liste des clients"
            - Receptions:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =gblTheme.Colors.Accent
                  BorderColor: =gblColorBorder
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Navigate(Sc_Receptions, ScreenTransition.Cover)
                  Text: ="Receptions"
      - Text3:
          Control: ModernText@1.0.0
          Properties:
            Height: =200
            Text: |-
              =Concatenate("appw: ", App.Width, " MinScreenW: ", App.MinScreenWidth, " ScreenW: ", Sc_Welcome.Width)
            Width: =444
            X: =112
            Y: =468
