Screens:
  Sc_ScanReceptionDoc:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Container2_2:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - TopBar_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =gblColorPrimary
                  FillPortions: =0
                  Height: =88
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                Children:
                  - ic_Back_2:
                      Control: ModernIcon@1.1.1
                      Properties:
                        Height: =88
                        Icon: ="ArrowLeft"
                        IconColor: =gblColorAccent
                        OnSelect: =Back()
                        PaddingBottom: =22
                        PaddingLeft: =22
                        PaddingRight: =22
                        PaddingTop: =22
                        Width: =88
                        X: =40
                        Y: =40
                  - lbl_PageName_ScanReceptionDoc:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =88
                        LayoutMinWidth: =0
                        Size: =27
                        Text: ="Scan Reception Doc"
                        Width: =291
                        Wrap: =false
                        X: =40
                        Y: =40
                  - IconNewItem1_3:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: =Self.Tooltip
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =88
                        Icon: =Icon.Add
                        OnSelect: =
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        PressedFill: =RGBA(255, 255, 255, 0.3)
                        TabIndex: =0
                        Tooltip: ="Create new item"
                        Width: =88
                        X: =Parent.Width - Self.Width
                        Y: =40
            - ReceptionInfo_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =176
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  X: =40
                  Y: =40
                Children:
                  - lbl_Reception_1:
                      Control: Label@2.5.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =gblColorBorder
                        Color: =gblColorTextSub
                        Fill: =gblColorSurface
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        Height: =88
                        LayoutMinWidth: =0
                        Text: =Concatenate(gal_Receptions.Selected.ReceptionReference, " | ", gal_Receptions.Selected.DateReception, " | ", gal_Receptions.Selected.ClientName)
                        Width: =640
                        X: =40
                        Y: =40
                  - cmb_DocumentType:
                      Control: ModernCombobox@1.1.1
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =gblTheme.Colors.TextMain
                        Fill: =gblTheme.Colors.Surface
                        Font: =Font.'Segoe UI'
                        ItemDisplayText: =ThisItem.Commentaire
                        Items: =Filter(DocumentTypes, OperationContext)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnChange: |-
                          =Set(
                              varFileNameScanReception,
                              gal_Receptions.Selected.ReceptionReference & " " & cmb_DocumentType.Selected.LabelDocumentType & ".jpg"
                          )
                        PaddingLeft: =5
                        SelectMultiple: =false
                        Size: =gblTheme.Fonts.Normal
            - Container5:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                Children:
                  - Text2:
                      Control: ModernText@1.0.0
                      Properties:
                        X: =40
                        Y: =40
                  - UploadedImage3:
                      Control: Image@2.2.3
                      Group: AddMediaWithImage
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =Parent.Height
                        Image: =If(IsBlank(AddMediaButton3.Media), SampleImage, AddMediaButton3.Media)
                        ImagePosition: =ImagePosition.Fill
                        Width: =Parent.Width
                        Y: '=0   '
                  - AddMediaButton3:
                      Control: AddMedia@2.2.1
                      Group: AddMediaWithImage
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =Parent.Height
                        Size: =25
                        Width: =Parent.Width
                        Y: '=0   '
            - Container6_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  ContentLanguage: =
                  Height: =88
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =88
                  LayoutMinHeight: =0
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  X: =40
                  Y: =40
                Children:
                  - Button1:
                      Control: ModernButton@1.0.0
                      Properties:
                        BasePaletteColor: =gblTheme.Colors.Accent
                        BorderColor: =gblTheme.Colors.Border
                        Font: =Font.'Segoe UI'
                        Height: =gblTheme.Controls.ButtonHeight
                        Icon: ="Save"
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        OnSelect: |-
                          =If(
                              IsBlank(AddMediaButton3.Media),
                              Notify(
                                  "Scanner avant de sauvegarder",
                                  NotificationType.Warning
                              ),
                              IsEmpty(cmb_DocumentType.SelectedItems),
                              Notify(
                                  "Choisir un type de Doc avant de sauvegarder",
                                  NotificationType.Warning
                              ),
                              IfError(
                                  FlowReceptionScanSave.Run(
                                      varFileNameScanReception,
                                      gal_Receptions.Selected.ReceptionReference,
                                      Text(
                                          LookUp(
                                              Clients,
                                              ID = gal_Receptions.Selected.'Client: Code Client'.Id
                                          ).'Code Client',
                                          "0000"
                                      ),
                                      JSON(
                                          UploadedImage3.Image,
                                          JSONFormat.IncludeBinaryData
                                      )
                                  ),
                                  Notify(
                                      "Scan non sauvegardé " & FirstError.Message,
                                      NotificationType.Error,
                                      7000
                                  ),
                                  Notify(
                                      "Scan sauvegardé",
                                      NotificationType.Success,
                                      4000
                                  )
                              )
                          );
                          Set(
                              varFileNameScanReception,
                              gal_Receptions.Selected.ReceptionReference & " " & cmb_DocumentType.Selected.LabelDocumentType & ".jpg"
                          )
                        PaddingBottom: =gblTheme.Controls.ScreenPadding
                        PaddingLeft: =gblTheme.Controls.ScreenPadding
                        PaddingRight: =gblTheme.Controls.ScreenPadding
                        PaddingTop: =gblTheme.Controls.ScreenPadding
                        RadiusTopLeft: =gblTheme.Controls.CardRadius
                        Size: =gblTheme.Fonts.Normal
                        Text: ="Enregistrer"
                        VerticalAlign: =VerticalAlign.Middle
